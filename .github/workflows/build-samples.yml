name: build-samples
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Instalar LLVM 18 y libssl1.1
        run: |
          echo "deb http://security.ubuntu.com/ubuntu focal-security main" | sudo tee /etc/apt/sources.list.d/focal-security.list
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 libssl1.1
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

      - name: Descargar toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern 'toolchain-llvm-18.tar.gz'
          mkdir -p $HOME/oo
          tar -xzf toolchain-llvm-18.tar.gz -C $HOME/oo
          chmod +x $HOME/oo/OpenOrbis/PS4Toolchain/bin/linux/*

      - name: Clonar samples
        run: git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo-src

      - name: Compilar samples
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
          CLR_OPENSSL_VERSION_OVERRIDE: "1.1"
        run: |
          export OO_PS4_TOOLCHAIN=$HOME/oo/OpenOrbis/PS4Toolchain
          touch /tmp/stamp
          sleep 1
          mkdir -p out
          for s in graphics input audio-wav SDL2 piglet; do
            echo "=============== $s ==============="
            D=oo-src/samples/$s
            if [ ! -f $D/sce_sys/about/right.sprx ]; then
              R=$(find $HOME/oo -name 'right.sprx' | head -1)
              mkdir -p $D/sce_sys/about
              cp "$R" $D/sce_sys/about/right.sprx
            fi
            if make -C $D; then echo "RESULTADO $s: OK"; else echo "RESULTADO $s: FALLO"; fi
          done
          find oo-src/samples -name '*.pkg' -newer /tmp/stamp -exec cp {} out/ \;
          echo "=============== RESUMEN ==============="
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: samples-pkg
          path: out/*.pkg
          if-no-files-found: warn
