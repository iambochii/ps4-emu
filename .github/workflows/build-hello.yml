name: build-hello
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Instalar LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          clang --version
          ld.lld --version

      - name: Descargar toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern 'toolchain-llvm-18.tar.gz'
          mkdir -p $HOME/oo
          tar -xzf toolchain-llvm-18.tar.gz -C $HOME/oo
          chmod +x $HOME/oo/OpenOrbis/PS4Toolchain/bin/linux/*

      - name: Clonar samples
        run: git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo-src

      - name: Compilar hello_world
        run: |
          export OO_PS4_TOOLCHAIN=$HOME/oo/OpenOrbis/PS4Toolchain
          make -C oo-src/samples/hello_world
          echo "=== ARCHIVOS GENERADOS ==="
          find oo-src/samples/hello_world -type f \( -name '*.pkg' -o -name 'eboot.bin' -o -name '*.elf' \) -exec ls -la {} +

      - uses: actions/upload-artifact@v4
        with:
          name: hello-pkg
          path: oo-src/samples/hello_world/**/*.pkg
          if-no-files-found: warn
